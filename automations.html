  <main class="page-content automation-catalog-page" id="main-content">
    <header class="page-head">
      <div class="container page-head-grid">
        <h1>Automations</h1>
        <p class="page-lede">Field, CAD and reporting tools built to take repetitive work off the job.</p>
      </div>
    </header>
    <div class="container page-body">
      <section id="automation-catalog" class="catalog-controls" aria-label="Automation catalog controls">
        <button class="catalog-search-toggle" type="button" aria-label="Open automation search" aria-expanded="false" aria-controls="automation-search-panel" data-automation-search-toggle>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" focusable="false">
            <circle cx="10.5" cy="10.5" r="6" />
            <path d="m15 15 4.5 4.5" />
          </svg>
        </button>
        <div class="catalog-filter-group" aria-label="Filter automations">
          <button class="catalog-filter is-active" type="button" data-automation-filter="all">All</button>
          <button class="catalog-filter" type="button" data-automation-filter="cad">CAD</button>
          <button class="catalog-filter" type="button" data-automation-filter="excel">Excel</button>
          <button class="catalog-filter" type="button" data-automation-filter="field">Field Operations</button>
          <button class="catalog-filter" type="button" data-automation-filter="reporting">Reporting</button>
          <button class="catalog-filter" type="button" data-automation-filter="apps">Apps &amp; Platforms</button>
          <button class="catalog-filter" type="button" data-automation-filter="ai">AI</button>
          <button class="catalog-filter" type="button" data-automation-filter="utility">Utilities</button>
        </div>
        <div class="catalog-count" aria-live="polite"><strong data-automation-count>0</strong><span>automations</span></div>
        <div class="catalog-search-panel" id="automation-search-panel" hidden>
          <input class="catalog-search" type="search" aria-label="Search automations" placeholder="Search automations" data-automation-search autocomplete="off" />
          <button class="button" type="button" data-automation-search-clear hidden>Clear</button>
        </div>
      </section>

      <section class="automation-grid" data-automation-grid aria-label="Automations"></section>
      <p class="catalog-empty" data-automation-empty hidden>No automations match that search.</p>
      <noscript><p class="catalog-empty">Enable JavaScript to browse the automation catalog.</p></noscript>
    </div>
  </main>
