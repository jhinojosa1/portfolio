  <div class="editorial-shell contact-page">
    <header class="contact-intro">
      <h1>Contact</h1>
      <p>For engineering opportunities, project inquiries, or questions about my automation work.</p>
      <div class="contact-actions">
        <a class="text-link" data-contact-email href="mailto:hinojosasb72@gmail.com">hinojosasb72@gmail.com</a>
        <button class="button" type="button" data-copy-email hidden>Copy email</button>
      </div>
      <p class="contact-status" data-copy-status role="status"></p>
      <a class="text-link" href="https://github.com/bufordcore-droid">GitHub profile <span aria-hidden="true">↗</span></a>
    </header>
    <form class="contact-form" action="https://formsubmit.co/hinojosasb72@gmail.com" method="post" data-contact-form aria-labelledby="contact-form-title">
      <h2 id="contact-form-title">Send an inquiry</h2>
      <input type="hidden" name="_subject" value="Portfolio inquiry" />
      <input type="text" name="_honey" tabindex="-1" autocomplete="off" hidden />
      <fieldset class="contact-fields" aria-label="Inquiry details">
        <div class="contact-field">
          <label for="contact-name">Name</label>
          <input id="contact-name" name="name" autocomplete="name" required />
        </div>
        <div class="contact-field">
          <label for="contact-email">Email</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" required />
        </div>
        <div class="contact-field contact-field-wide">
          <label for="contact-subject">Subject</label>
          <input id="contact-subject" name="subject" required />
        </div>
        <div class="contact-field contact-field-wide">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" rows="6" required></textarea>
        </div>
      </fieldset>
      <div class="contact-form-actions">
        <button class="button button-primary" type="submit">Send message</button>
        <p class="contact-status" data-contact-status role="status"></p>
      </div>
    </form>
  </div>
